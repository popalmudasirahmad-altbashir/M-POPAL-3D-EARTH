<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>M POPAL TECH • 360° EARTH</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#01030a;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    color:white;
    touch-action:none;
}


/* BACKGROUND */

.space{
    position:fixed;
    inset:0;
    overflow:hidden;

    background:
    radial-gradient(
        circle at 50% 48%,
        rgba(0,150,255,.10),
        transparent 30%
    ),
    radial-gradient(
        circle at 20% 20%,
        rgba(0,220,255,.07),
        transparent 25%
    ),
    radial-gradient(
        circle at 80% 80%,
        rgba(255,0,200,.08),
        transparent 28%
    ),
    #01030a;
}


/* STARS */

.stars,
.stars2,
.stars3{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.stars{
    background-image:
    radial-gradient(circle,#fff 1px,transparent 1px);
    background-size:90px 90px;
    opacity:.45;
}

.stars2{
    background-image:
    radial-gradient(circle,#70eaff 1px,transparent 1px);
    background-size:150px 150px;
    background-position:30px 50px;
    opacity:.30;
}

.stars3{
    background-image:
    radial-gradient(circle,#ff7bea 1px,transparent 1px);
    background-size:220px 220px;
    background-position:90px 120px;
    opacity:.22;
}


/* HEADER */

.header{
    position:fixed;

    top:0;
    left:0;
    width:100%;

    height:76px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 28px;

    z-index:100;

    background:
    linear-gradient(
        180deg,
        rgba(1,3,10,.75),
        transparent
    );

    backdrop-filter:blur(8px);
}


/* LOGO */

.logo{
    font-size:16px;

    font-weight:800;

    letter-spacing:6px;

    text-shadow:
    0 0 7px #fff,
    0 0 15px #00d9ff,
    0 0 25px #ff00d9;
}


/* MENU */

.menu{
    width:45px;
    height:45px;

    border-radius:50%;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:5px;

    border:
    1px solid rgba(255,255,255,.4);

    background:
    rgba(255,255,255,.04);

    box-shadow:
    0 0 15px rgba(255,255,255,.08);

    cursor:pointer;
}

.menu span{
    width:17px;
    height:1px;

    background:white;

    box-shadow:
    0 0 7px white;
}


/* MAIN */

.main{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:10;
}


/* EARTH AREA */

.earth-area{

    width:min(86vw,700px);
    height:min(86vw,700px);

    max-width:76vh;
    max-height:76vh;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;
}


/* OUTER GLOW */

.earth-glow{

    position:absolute;

    width:100%;
    height:100%;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(0,190,255,.22),
        transparent 63%
    );

    filter:blur(18px);

    animation:
    glow 4s ease-in-out infinite alternate;

    pointer-events:none;
}

@keyframes glow{

    from{
        transform:scale(.96);
        opacity:.65;
    }

    to{
        transform:scale(1.08);
        opacity:1;
    }
}


/* 3D EARTH */

#earth{

    width:86%;
    height:86%;

    border-radius:50%;

    position:relative;

    cursor:grab;

    user-select:none;

    touch-action:none;

    background:

    radial-gradient(
        circle at 35% 30%,
        #66eaff 0%,
        #087db8 32%,
        #00436e 60%,
        #001625 85%,
        #00050a 100%
    );

    box-shadow:

    inset -35px -25px 70px rgba(0,0,0,.75),

    inset 18px 12px 35px rgba(255,255,255,.18),

    0 0 20px rgba(255,255,255,.45),

    0 0 45px rgba(0,210,255,.45),

    0 0 85px rgba(0,150,255,.25),

    0 0 120px rgba(255,0,210,.12);

    transform:
    rotateX(0deg)
    rotateY(0deg);

    transition:
    box-shadow .4s ease;
}

#earth:active{
    cursor:grabbing;
}


/* WHITE EDGE */

#earth::before{

    content:"";

    position:absolute;

    inset:-2px;

    border-radius:50%;

    border:
    2px solid rgba(255,255,255,.8);

    box-shadow:

    0 0 7px white,

    0 0 16px rgba(255,255,255,.8),

    0 0 30px rgba(0,210,255,.65);

    pointer-events:none;

    z-index:20;
}


/* SECOND EDGE */

#earth::after{

    content:"";

    position:absolute;

    inset:-11px;

    border-radius:50%;

    border:
    1px solid rgba(0,220,255,.32);

    box-shadow:
    0 0 20px rgba(0,210,255,.25),
    0 0 30px rgba(255,0,210,.12);

    pointer-events:none;
}


/* CONTINENTS */

.continents{

    position:absolute;

    inset:0;

    border-radius:50%;

    overflow:hidden;

    pointer-events:none;

    opacity:.92;

    background:

    /*
    AFRICA
    */

    radial-gradient(
        ellipse 12% 27% at 53% 56%,
        rgba(255,255,255,.95) 0 42%,
        transparent 44%
    ),

    /*
    EUROPE
    */

    radial-gradient(
        ellipse 13% 8% at 53% 35%,
        rgba(255,255,255,.95) 0 40%,
        transparent 42%
    ),

    /*
    ASIA
    */

    radial-gradient(
        ellipse 27% 14% at 69% 37%,
        rgba(255,255,255,.92) 0 38%,
        transparent 40%
    ),

    /*
    NORTH AMERICA
    */

    radial-gradient(
        ellipse 24% 18% at 29% 31%,
        rgba(255,255,255,.92) 0 40%,
        transparent 42%
    ),

    /*
    SOUTH AMERICA
    */

    radial-gradient(
        ellipse 10% 25% at 38% 64%,
        rgba(255,255,255,.92) 0 38%,
        transparent 40%
    ),

    /*
    AUSTRALIA
    */

    radial-gradient(
        ellipse 12% 8% at 76% 69%,
        rgba(255,255,255,.9) 0 40%,
        transparent 42%
    );

    filter:
    drop-shadow(0 0 3px white);
}


/* MAP LINES */

.grid{

    position:absolute;

    inset:0;

    border-radius:50%;

    overflow:hidden;

    pointer-events:none;

    opacity:.55;

    background:

    repeating-linear-gradient(
        0deg,
        transparent 0 12%,
        rgba(255,255,255,.38) 12.2% 12.45%,
        transparent 12.7% 25%
    ),

    repeating-linear-gradient(
        90deg,
        transparent 0 13%,
        rgba(255,255,255,.35) 13.2% 13.45%,
        transparent 13.7% 26%
    );

    mix-blend-mode:screen;
}


/* LIGHT */

.light{

    position:absolute;

    inset:0;

    border-radius:50%;

    background:

    radial-gradient(
        circle at 30% 25%,
        rgba(255,255,255,.35),
        transparent 24%
    ),

    linear-gradient(
        115deg,
        transparent 30%,
        rgba(255,255,255,.10),
        transparent 55%
    );

    pointer-events:none;
}


/* RINGS */

.ring{

    position:absolute;

    width:108%;
    height:32%;

    border-radius:50%;

    border:
    1px solid rgba(255,255,255,.5);

    box-shadow:
    0 0 8px rgba(255,255,255,.6),
    0 0 20px rgba(0,210,255,.45);

    transform:
    rotate(-18deg);

    pointer-events:none;
}

.ring2{

    position:absolute;

    width:115%;
    height:43%;

    border-radius:50%;

    border:
    1px solid rgba(255,0,210,.35);

    transform:
    rotate(18deg);

    box-shadow:
    0 0 15px rgba(255,0,210,.2);

    pointer-events:none;
}


/* 360 LABEL */

.degree{

    position:absolute;

    bottom:-55px;

    left:50%;

    transform:translateX(-50%);

    font-size:12px;

    letter-spacing:7px;

    color:white;

    text-shadow:
    0 0 8px white,
    0 0 18px #00d9ff;
}


/* INSTRUCTION */

.instruction{

    position:fixed;

    bottom:42px;

    left:50%;

    transform:translateX(-50%);

    z-index:50;

    text-align:center;

    color:#9fa3ad;

    font-size:10px;

    letter-spacing:4px;

    white-space:nowrap;

    text-shadow:
    0 0 10px rgba(0,210,255,.5);
}


/* SIDE DATA */

.side-info{

    position:fixed;

    left:30px;

    bottom:32px;

    z-index:50;

    color:#777;

    font-size:9px;

    line-height:1.8;

    letter-spacing:2px;
}

.side-info strong{
    color:white;

    font-weight:500;
}


/* MENU PANEL */

.panel{

    position:fixed;

    top:0;
    right:-100%;

    width:min(380px,90vw);

    height:100vh;

    z-index:500;

    background:
    rgba(2,4,12,.96);

    backdrop-filter:blur(25px);

    border-left:
    1px solid rgba(255,255,255,.3);

    box-shadow:
    -20px 0 70px rgba(0,0,0,.7),
    -5px 0 25px rgba(0,210,255,.12);

    padding:120px 35px;

    transition:
    right .5s cubic-bezier(.77,0,.18,1);
}

.panel.open{
    right:0;
}

.panel h2{

    font-size:11px;

    letter-spacing:6px;

    color:#777;

    margin-bottom:45px;
}

.panel-item{

    display:block;

    padding:22px 0;

    border-bottom:
    1px solid rgba(255,255,255,.12);

    color:white;

    text-decoration:none;

    font-size:17px;

    letter-spacing:3px;

    transition:.3s;
}

.panel-item:hover{

    padding-left:14px;

    text-shadow:
    0 0 10px #00d9ff,
    0 0 20px #ff00d9;
}

.panel-close{

    position:absolute;

    top:25px;
    right:25px;

    width:43px;
    height:43px;

    border-radius:50%;

    border:
    1px solid rgba(255,255,255,.35);

    background:
    rgba(255,255,255,.05);

    color:white;

    font-size:22px;

    cursor:pointer;
}


/* MOBILE */

@media(max-width:600px){

    .header{
        height:65px;
        padding:0 17px;
    }

    .logo{
        font-size:11px;
        letter-spacing:4px;
    }

    .menu{
        width:41px;
        height:41px;
    }

    .earth-area{
        width:88vw;
        height:88vw;
        max-width:none;
        max-height:none;
    }

    .degree{
        bottom:-45px;
        font-size:9px;
        letter-spacing:5px;
    }

    .instruction{
        bottom:24px;
        font-size:8px;
        letter-spacing:2px;
    }

    .side-info{
        display:none;
    }

}


/* VERY SMALL */

@media(max-height:600px){

    .earth-area{
        width:68vh;
        height:68vh;
    }

    .instruction{
        bottom:12px;
    }

}

</style>
</head>


<body>


<div class="space">

    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>


    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            M POPAL TECH
        </div>

        <button
        class="menu"
        id="menuButton">

            <span></span>
            <span></span>
            <span></span>

        </button>

    </header>


    <!-- EARTH -->

    <main class="main">

        <div class="earth-area">

            <div class="earth-glow"></div>

            <div id="earth">

                <div class="continents"></div>

                <div class="grid"></div>

                <div class="light"></div>

            </div>

            <div class="ring"></div>

            <div class="ring2"></div>

            <div class="degree">
                360° EARTH
            </div>

        </div>

    </main>


    <!-- INFORMATION -->

    <div class="side-info">

        <strong>PLANET EARTH</strong><br>

        INTERACTIVE GLOBE<br>

        TOUCH / DRAG<br>

        360° CONTROL

    </div>


    <div class="instruction">

        ← DRAG THE EARTH WITH YOUR FINGER →

    </div>


</div>


<!-- MENU PANEL -->

<div
class="panel"
id="panel">

    <button
    class="panel-close"
    id="panelClose">
        ×
    </button>

    <h2>
        M POPAL TECH
    </h2>

    <a
    href="#"
    class="panel-item"
    id="backButton">
        BACK
    </a>

    <a
    href="#"
    class="panel-item">
        NONE
    </a>

    <a
    href="#"
    class="panel-item">
        360° EXPERIENCE
    </a>

</div>


<script>

/* ==========================================
   EARTH TOUCH / MOUSE ENGINE
========================================== */

const earth =
document.getElementById("earth");


let rotationX = 0;

let rotationY = 0;

let startX = 0;

let startY = 0;

let lastX = 0;

let lastY = 0;

let velocityX = 0;

let velocityY = 0;

let dragging = false;


/* APPLY ROTATION */

function renderEarth(){

    earth.style.transform =
    "rotateX(" +
    rotationX +
    "deg) rotateY(" +
    rotationY +
    "deg)";

}


/* START */

function startInteraction(x,y){

    dragging = true;

    startX = x;
    startY = y;

    lastX = x;
    lastY = y;

    velocityX = 0;
    velocityY = 0;

}


/* MOVE */

function moveInteraction(x,y){

    if(!dragging) return;

    const dx =
    x - lastX;

    const dy =
    y - lastY;


    rotationY += dx * 0.45;

    rotationX -= dy * 0.45;


    /* LIMIT VERTICAL */

    if(rotationX > 85)
        rotationX = 85;

    if(rotationX < -85)
        rotationX = -85;


    velocityX = dx * 0.45;

    velocityY = dy * 0.45;


    lastX = x;

    lastY = y;


    renderEarth();

}


/* END */

function endInteraction(){

    dragging = false;

}


/* ==========================================
   TOUCH
========================================== */

earth.addEventListener(
"touchstart",
function(e){

    const touch =
    e.touches[0];

    startInteraction(
        touch.clientX,
        touch.clientY
    );

},
{passive:false}
);


earth.addEventListener(
"touchmove",
function(e){

    e.preventDefault();

    const touch =
    e.touches[0];

    moveInteraction(
        touch.clientX,
        touch.clientY
    );

},
{passive:false}
);


earth.addEventListener(
"touchend",
function(){

    endInteraction();

}
);


/* ==========================================
   MOUSE
========================================== */

earth.addEventListener(
"mousedown",
function(e){

    startInteraction(
        e.clientX,
        e.clientY
    );

}
);


window.addEventListener(
"mousemove",
function(e){

    moveInteraction(
        e.clientX,
        e.clientY
    );

}
);


window.addEventListener(
"mouseup",
function(){

    endInteraction();

}
);


/* ==========================================
   INERTIA
========================================== */

function inertia(){

    if(!dragging){

        rotationY += velocityX;

        rotationX -= velocityY;


        velocityX *= .94;

        velocityY *= .94;


        if(Math.abs(velocityX) < .01)
            velocityX = 0;

        if(Math.abs(velocityY) < .01)
            velocityY = 0;


        if(rotationX > 85)
            rotationX = 85;

        if(rotationX < -85)
            rotationX = -85;


        renderEarth();

    }


    requestAnimationFrame(inertia);

}

inertia();


/* ==========================================
   MENU
========================================== */

const menuButton =
document.getElementById("menuButton");

const panel =
document.getElementById("panel");

const panelClose =
document.getElementById("panelClose");

const backButton =
document.getElementById("backButton");


menuButton.onclick =
function(){

    panel.classList.add("open");

};


panelClose.onclick =
function(){

    panel.classList.remove("open");

};


backButton.onclick =
function(e){

    e.preventDefault();

    panel.classList.remove("open");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

};


/* ==========================================
   ESC
========================================== */

document.addEventListener(
"keydown",
function(e){

    if(e.key === "Escape"){

        panel.classList.remove("open");

    }

});

</script>

</body>
</html>
